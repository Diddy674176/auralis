name: Restore playerEngine
on:
  push:
    paths:
      - 'tools/pe_restore/**'
      - '.github/workflows/restore-pe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild playerEngine.ts
        run: |
          cat tools/pe_restore/pe.b64.part0 tools/pe_restore/pe.b64.part1 tools/pe_restore/pe.b64.part2 | base64 -d > src/lib/playerEngine.ts
          wc -c src/lib/playerEngine.ts
          head -c 80 src/lib/playerEngine.ts; echo
          test "$(wc -c < src/lib/playerEngine.ts)" -eq 15699
          grep -q PRELOAD_AHEAD src/lib/playerEngine.ts
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/playerEngine.ts
          git diff --staged --quiet || git commit -m "fix: restore progressive playerEngine from b64 parts"
          git push
